<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 도구 18선 자율학습</title>
<meta name="description" content="날짜에 묶이지 않고 원하는 순서로 배우는 생성형 AI 도구 18선 교재">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --surface-2:#f0eee8; --ink:#1b1d24; --ink-2:#4a4f5c; --ink-3:#7a7f8c;
  --line:#e2dfd6; --accent:#2b3a8f; --accent-soft:#e6e9f7; --ok:#1f7a4d; --ok-soft:#e3f3ea;
  --warn:#9a5b00; --warn-soft:#fdf1dc; --danger:#a12a2a; --danger-soft:#fbe6e6;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --surface:#1c1f26; --surface-2:#242832; --ink:#eceef3; --ink-2:#b6bbc7; --ink-3:#8a90a0;
    --line:#2e333f; --accent:#9fb0ff; --accent-soft:#262d4a; --ok:#6fd3a0; --ok-soft:#1d3329;
    --warn:#f2b552; --warn-soft:#3a2d16; --danger:#f08a8a; --danger-soft:#3a1f22; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1c1f26; --surface-2:#242832; --ink:#eceef3; --ink-2:#b6bbc7; --ink-3:#8a90a0;
  --line:#2e333f; --accent:#9fb0ff; --accent-soft:#262d4a; --ok:#6fd3a0; --ok-soft:#1d3329;
  --warn:#f2b552; --warn-soft:#3a2d16; --danger:#f08a8a; --danger-soft:#3a1f22; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:800;letter-spacing:-.02em;text-decoration:none;color:var(--ink);font-size:17px;white-space:nowrap}
.brand small{font-weight:500;color:var(--ink-3);margin-left:6px;font-size:13px}
.prog-mini{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;width:min(220px,40vw)}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.prog-mini span{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;font-size:14px}
.icon-btn:hover{border-color:var(--ink-3)}

/* home */
.hero{padding:40px 0 20px}
.hero h1{font-size:clamp(26px,4.4vw,40px);line-height:1.25;letter-spacing:-.03em;margin:0 0 12px;font-weight:800}
.hero p{color:var(--ink-2);margin:0;max-width:680px}
.notice{margin:20px 0 0;padding:14px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:14.5px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.notice b{color:var(--warn)}
h2.sec{font-size:20px;letter-spacing:-.02em;margin:36px 0 12px}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.path h3{margin:0 0 4px;font-size:16px}
.path p{margin:0 0 10px;color:var(--ink-2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink);text-decoration:none;border:1px solid transparent;cursor:pointer}
.chip:hover{border-color:var(--line)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;font-size:14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding-bottom:40px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--ink-3)}
.card .no{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}
.card h3{margin:0;font-size:18px;letter-spacing:-.02em}
.card p{margin:0;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.warn{background:var(--danger-soft);color:var(--danger)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.card.complete{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}

/* lesson */
.lesson{padding:28px 0 60px}
.crumb{font-size:14px;color:var(--ink-3);margin-bottom:12px}
.crumb a{color:var(--ink-3);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.l-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:20px}
.l-head h1{font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:-.03em;line-height:1.15}
.l-head .sub{color:var(--ink-2);margin-top:6px}
.l-head .links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#111}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px}
@media (max-width:860px){.layout{grid-template-columns:1fr}.side .sticky{position:static}}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.block h2{font-size:18px;margin:0 0 10px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.block h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:13px}
.block ul,.block ol{margin:0;padding-left:20px}
.block li{margin:4px 0}
.block p{margin:0 0 8px}
.lead{font-size:17px;color:var(--ink);margin:0 0 4px}
.status{padding:14px 16px;border-radius:12px;margin-bottom:16px;font-size:15px;background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.status b{color:var(--danger)}
.status.info{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.status.info b{color:var(--warn)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;list-style:none;padding:0!important}
.feat li{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0!important;font-size:14.5px}
.feat li b{display:block;font-size:15px;margin-bottom:2px}
.prac{border-left:4px solid var(--accent)}
.prac.pro{border-left-color:var(--ok)}
.prac .kind{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.prac.pro .kind{color:var(--ok)}
.prompt{position:relative;margin-top:12px;background:var(--surface-2);border-radius:10px;padding:14px 14px 14px 14px;font-size:14.5px;white-space:pre-wrap;line-height:1.6;border:1px dashed var(--line)}
.prompt .copy{position:absolute;top:8px;right:8px;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.prompt .lbl{display:block;font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.tips li{list-style:none;position:relative;padding-left:4px}
.tips{padding-left:0!important}
.tips li::before{content:"·";position:absolute;left:-12px;color:var(--ink-3)}
.side .sticky{position:sticky;top:72px;display:flex;flex-direction:column;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:15px}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok);flex:none}
textarea.memo{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:14px}
.saved{font-size:12px;color:var(--ink-3);height:16px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.pager a{flex:1;max-width:48%}
.pager .next{text-align:right;justify-content:flex-end}
.small{font-size:13px;color:var(--ink-3)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--ink-3);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
@media print{header.top,.side,.pager,.prompt .copy{display:none}.layout{display:block}.block{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#">AI 도구 18선<small>자율학습</small></a>
    <div class="prog-mini">
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
      <span id="progText">0 / 54</span>
      <button class="icon-btn" id="themeBtn" title="화면 테마 바꾸기" aria-label="화면 테마 바꾸기">테마</button>
    </div>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer>
  <div class="wrap">
    내용 기준일: 2026년 10월. AI 서비스는 이름, 요금, 기능이 자주 바뀌니 각 레슨의 공식 사이트에서 최신 정보를 함께 확인하세요.
    진도와 메모는 이 브라우저에만 저장됩니다.
    <button class="icon-btn" id="resetBtn" style="margin-left:8px;height:28px;font-size:12px">진도 초기화</button>
  </div>
</footer>
<div class="toast" id="toast"></div>

<script>
const CATS = {
  chat:{label:"대화형 AI"}, search:{label:"검색·리서치"}, agent:{label:"제작 에이전트"},
  image:{label:"이미지"}, video:{label:"영상"}, audio:{label:"음성"}, design:{label:"디자인"}
};

const PATHS = [
  {title:"처음 시작한다면", desc:"대화형 AI의 기본기를 먼저 익힙니다.", ids:["chatgpt","claude","gemini","perplexity"]},
  {title:"포스터·홍보물 작업", desc:"이미지 생성과 편집, 레이아웃까지 이어지는 순서입니다.", ids:["nanobanana","leonardo","canva","claude"]},
  {title:"공연 홍보 영상", desc:"짧은 티저 영상과 자막 작업에 맞춘 순서입니다.", ids:["sora","veo","kling","assembly"]},
  {title:"웹페이지·업무 자동화", desc:"말로 설명해서 페이지와 결과물을 만드는 도구입니다.", ids:["lovable","manus","claude","kimi"]}
];

const LESSONS = [
{
  id:"chatgpt", no:1, name:"ChatGPT", cat:"chat", maker:"OpenAI", url:"https://chatgpt.com",
  one:"가장 널리 쓰이는 범용 AI 비서입니다. 글쓰기, 요약, 이미지 생성, 음성 대화를 한곳에서 할 수 있습니다.",
  when:["무엇이든 처음 물어볼 때 쓰는 기본 도구가 필요할 때","글 초안, 요약, 번역, 아이디어를 빠르게 얻고 싶을 때","대화 안에서 바로 이미지를 만들거나 고치고 싶을 때"],
  start:["chatgpt.com에 접속하거나 모바일 앱을 설치합니다.","Google, Apple, Microsoft 계정이나 이메일로 가입합니다.","왼쪽 아래 프로필 → 설정에서 언어와 '맞춤 설정(나에 대한 정보)'을 먼저 입력해 두면 답변 품질이 좋아집니다."],
  features:[
    ["프로젝트","관련 대화와 파일을 한 폴더에 모아 두고 이어서 작업합니다."],
    ["이미지 생성·편집","대화창에서 이미지를 만들고, 일부만 고쳐 달라고 요청할 수 있습니다."],
    ["심층 리서치","여러 웹 자료를 찾아 출처가 달린 보고서를 만듭니다."],
    ["음성 대화","말로 묻고 답을 듣습니다. 이동 중 학습에 좋습니다."],
    ["GPT(맞춤 챗봇)","자주 하는 작업을 지침과 함께 저장해 재사용합니다."]
  ],
  basic:{title:"좋은 질문의 4요소 익히기", steps:["역할, 목적, 조건, 출력 형식을 넣어 질문합니다.","같은 질문을 요소 없이 한 번, 요소를 넣어 한 번 해서 결과를 비교합니다.","마음에 들지 않는 부분을 '이 부분만 고쳐줘'로 다듬어 봅니다."],
    prompt:"너는 10년 차 편집 디자이너야.\n[목적] 처음 의뢰받은 클라이언트에게 보낼 작업 안내 메일을 쓰려고 해.\n[조건] 정중하지만 짧게, 일정·수정 횟수·파일 전달 방식을 포함해.\n[형식] 제목 1줄 + 본문 8줄 이내."},
  pro:{title:"공연 포스터 콘셉트 3안 만들기", steps:["공연 정보를 주고 콘셉트 3안을 글로 받습니다.","가장 좋은 안을 골라 이미지 시안을 요청합니다.","이미지는 '방향 확인용'으로만 쓰고, 실제 타이포그래피는 직접 작업합니다."],
    prompt:"합창단 정기연주회 포스터 콘셉트를 3가지 제안해줘.\n- 곡목: 헨델 〈메시아〉 전곡\n- 분위기: 경건하지만 현대적\n- 사용처: A2 포스터, 인스타그램 정사각형\n각 안마다 콘셉트 이름, 핵심 이미지, 색상 팔레트(HEX 3개), 서체 방향, 레이아웃 스케치를 글로 설명해줘."},
  tips:["사실 정보(연도, 인물, 곡 해설)는 반드시 원자료로 확인하세요. 그럴듯하게 틀릴 수 있습니다.","이미지 안의 한글 글자는 깨지기 쉽습니다. 글자는 디자인 프로그램에서 넣는 것이 안전합니다.","클라이언트의 미공개 자료를 올릴 때는 설정의 데이터 학습 사용 여부를 먼저 확인하세요."]
},
{
  id:"claude", no:2, name:"Claude", cat:"chat", maker:"Anthropic", url:"https://claude.ai",
  one:"긴 문서를 읽고 정리하는 능력과 자연스러운 글쓰기에 강한 AI입니다. 웹페이지나 도구를 바로 만들어 주는 기능도 있습니다.",
  when:["PDF, 원고처럼 긴 자료를 읽고 정리해야 할 때","보도자료, 프로그램 노트처럼 문장 품질이 중요한 글을 쓸 때","HTML 학습 페이지나 간단한 도구를 만들고 싶을 때"],
  start:["claude.ai에 접속하거나 데스크톱·모바일 앱을 설치합니다.","이메일이나 Google 계정으로 가입합니다.","설정 → 프로필에 직업과 선호하는 답변 스타일을 적어 둡니다."],
  features:[
    ["아티팩트","대화 중에 웹페이지, 문서, 다이어그램을 만들어 옆 화면에 띄웁니다."],
    ["프로젝트","자료와 지침을 넣어 두면 그 안의 모든 대화가 같은 맥락을 공유합니다."],
    ["파일 분석","PDF, 이미지, 스프레드시트를 올려 내용 정리나 비교를 시킵니다."],
    ["Cowork(데스크톱)","내 컴퓨터의 폴더와 파일을 다루는 작업을 맡깁니다."],
    ["스킬","반복 작업 방식을 저장해 두고 다시 씁니다."]
  ],
  basic:{title:"긴 자료 요약과 재구성", steps:["읽어야 할 PDF 하나를 올립니다.","핵심 요약, 표 정리, 질문 5개 만들기를 차례로 요청합니다.","원문의 몇 쪽에 근거가 있는지 물어 확인합니다."],

  <section class="hero">
    <h1>날짜에 묶이지 않는<br>AI 도구 18선 교재</h1>
    <p>광고 속 '1일차~18일차' 목록을 원하는 순서로 배울 수 있게 재구성했습니다. 레슨마다 <b>기본 실습</b>과 <b>디자이너 실무 실습</b>이 하나씩 있고, 체크한 진도와 메모는 이 브라우저에 저장됩니다.
    지금까지 <b>${completed}개</b> 레슨을 마쳤습니다.${next ? ` 이어서 하기: <a href="#/${next.id}">${esc(next.name)}</a>` : ""}</p>
    <div class="notice"><b>알림</b> · 16번 Sora 2는 2026년 9월 24일에 서비스가 완전히 종료되었습니다. 해당 레슨은 Veo와 Kling에 그대로 쓸 수 있는 '영상 프롬프트 설계법'으로 바꿔 두었습니다.</div>
  </section>
  <h2 class="sec">목적별 추천 경로</h2>
  <div class="paths">${PATHS.map(p => `
    <div class="path"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
      <div class="chips">${p.ids.map(id => { const l = byId(id); return `<a class="chip ${doneCount(id)===3?"done":""}" href="#/${id}">${doneCount(id)===3?"✓ ":""}${esc(l.name)}</a>`; }).join("")}</div>
    </div>`).join("")}
  </div>
  <h2 class="sec">전체 레슨</h2>
  <div class="filters" role="group" aria-label="분류">${filters.map(([k,v]) => `<button data-f="${k}" aria-pressed="${filter===k}">${v}</button>`).join("")}</div>
  <div class="grid">${list.map(l => `
    <a class="card ${doneCount(l.id)===3?"complete":""}" href="#/${l.id}">
      <span class="no">${pad(l.no)}</span>
      <h3>${esc(l.name)}</h3>
      <p>${esc(l.one)}</p>
      <div class="meta">${l.status ? `<span class="tag warn">서비스 종료</span>` : `<span class="tag">${CATS[l.cat].label}</span>`}${dots(l.id)}</div>
    </a>`).join("") || '<p class="small">모든 레슨을 마쳤습니다.</p>'}
  </div>`;
  $app.querySelectorAll(".filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; renderHome(); });
}

function promptBox(label, text){
  return `<div class="prompt"><span class="lbl">${label}</span><button class="copy" type="button">복사</button><span class="txt">${esc(text)}</span></div>`;
}

function renderLesson(l){
  const idx = LESSONS.indexOf(l), prev = LESSONS[idx-1], next = LESSONS[idx+1];
  const labels = checkLabels(l), d = doneArr(l.id);
  $app.innerHTML = `
  <article class="lesson">
    <div class="crumb"><a href="#">← 전체 레슨</a> · ${pad(l.no)} · ${CATS[l.cat].label}</div>
    <div class="l-head">
      <div><h1>${esc(l.name)}</h1><div class="sub">${esc(l.maker)}</div></div>
      <div class="links">${l.status ? "" : `<a class="btn primary" href="${l.url}" target="_blank" rel="noopener">공식 사이트 열기 ↗</a>`}</div>
    </div>
    <div class="layout">
      <div>
        ${l.status ? `<div class="status"><b>${esc(l.status.text.split(":")[0])}</b> ·${esc(l.status.text.slice(l.status.text.indexOf(":")+1))}</div>` : ""}
        <section class="block"><p class="lead">${esc(l.one)}</p></section>
        <section class="block"><h2><span class="n">1</span>이럴 때 씁니다</h2><ul>${l.when.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></section>
        <section class="block"><h2><span class="n">2</span>${l.status ? "준비하기" : "시작하기"}</h2><ol>${l.start.map(w=>`<li>${esc(w)}</li>`).join("")}</ol></section>
        <section class="block"><h2><span class="n">3</span>${l.status ? "영상 프롬프트 6요소" : "핵심 기능"}</h2><ul class="feat">${l.features.map(([a,b])=>`<li><b>${esc(a)}</b>${esc(b)}</li>`).join("")}</ul></section>
        <section class="block prac"><span class="kind">기본 실습</span><h2>${esc(l.basic.title)}</h2><ol>${l.basic.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${promptBox("예시 프롬프트", l.basic.prompt)}</section>
        <section class="block prac pro"><span class="kind">디자이너 실무 실습</span><h2>${esc(l.pro.title)}</h2><ol>${l.pro.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${promptBox("예시 프롬프트", l.pro.prompt)}</section>
        <section class="block"><h2><span class="n">!</span>주의할 점과 팁</h2><ul class="tips">${l.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>
        <nav class="pager">
          ${prev ? `<a class="btn" href="#/${prev.id}">← ${pad(prev.no)} ${esc(prev.name)}</a>` : "<span></span>"}
          ${next ? `<a class="btn next" href="#/${next.id}">${pad(next.no)} ${esc(next.name)} →</a>` : `<a class="btn next" href="#">전체 레슨으로 →</a>`}
        </nav>
      </div>
      <aside class="side"><div class="sticky">
        <section class="block" style="margin:0"><h2>학습 체크</h2>
          ${labels.map((t,i)=>`<label class="check"><input type="checkbox" data-i="${i}" ${d[i]?"checked":""}><span>${esc(t)}</span></label>`).join("")}
        </section>
        <section class="block" style="margin:0"><h2>내 메모</h2>
          <textarea class="memo" id="memo" placeholder="써 보고 느낀 점, 잘 된 프롬프트를 적어 두세요."></textarea>
          <div class="saved" id="saved"></div>
        </section>
      </div></aside>
    </div>
  </article>`;
  $app.querySelectorAll(".check input").forEach(cb => cb.onchange = () => {
    const a = doneArr(l.id).slice(); a[+cb.dataset.i] = cb.checked; state.done[l.id] = a; save(); updateTop();
    if (a.every(Boolean)) toast(l.name + " 레슨 완료!");
  });
  const memo = document.getElementById("memo"); memo.value = state.memo[l.id] || "";
  let t; memo.oninput = () => { clearTimeout(t); t = setTimeout(() => { state.memo[l.id] = memo.value; save(); document.getElementById("saved").textContent = "저장됨"; }, 400); };
  $app.querySelectorAll(".prompt .copy").forEach(b => b.onclick = () => {
    const txt = b.parentElement.querySelector(".txt").textContent;
    const done = () => toast("프롬프트를 복사했습니다");
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); else fallbackCopy(txt, done);
  });
}
function fallbackCopy(txt, cb){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); cb(); }

function route(){
  const id = location.hash.replace(/^#\/?/, "");
  const l = id && byId(id);
  if (l) { renderLesson(l); document.title = l.name + " · AI 도구 18선"; }
  else { renderHome(); document.title = "AI 도구 18선 자율학습"; }
  window.scrollTo(0,0); updateTop();
}
window.addEventListener("hashchange", route);

// theme
const root = document.documentElement;
try { const th = localStorage.getItem(KEY+"-theme"); if (th) root.dataset.theme = th; } catch(e){}
document.getElementById("themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem(KEY+"-theme", root.dataset.theme); } catch(e){}
};
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("체크한 진도와 메모를 모두 지울까요?")) return;
  state = {done:{}, memo:{}}; save(); route();
};
route();
})();

</script>
</body>
</html>
